
<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <title>sainbyte — Project Dashboard</title>

  <!-- Icons & Web Manifest -->

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090b;
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-row {
      animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .modal-backdrop { transition: opacity 0.22s ease; }
    .modal-card { transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body class="text-zinc-100 antialiased min-h-screen flex flex-col selection:bg-emerald-500/30 selection:text-emerald-200">

  <!-- Navbar / Header -->
  <header class="sticky top-0 z-30 border-b border-zinc-800/80 bg-zinc-950/75 backdrop-blur-md">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
      <a href="#" onclick="resetFilters(event)" class="flex items-center gap-2.5 group shrink-0">
        <span class="w-7 h-7 rounded-lg bg-emerald-500/15 border border-emerald-500/25 flex items-center justify-center text-emerald-400 font-mono font-bold text-sm">s</span>
        <span class="font-mono font-bold text-lg tracking-tight text-white">sainbyte</span>
      </a>

      <!-- Auth Actions -->
      <div id="authControls" class="flex items-center gap-1.5 sm:gap-2"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-7 sm:py-9">
    
    <!-- Search & Count -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
      <div class="relative flex-1">
        <svg class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z" />
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Cari project atau keterangan..." 
          class="w-full bg-zinc-900/70 border border-zinc-800/90 rounded-xl pl-10 pr-4 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-emerald-500/60 focus:ring-2 focus:ring-emerald-500/15 transition-all"
        />
      </div>
      <div class="text-xs font-mono text-zinc-500 px-1 shrink-0" id="projectCount">
        Memuat data...
      </div>
    </div>

    <!-- Category Filter Pills -->
    <div id="categoryFilterBar" class="hidden flex items-center gap-2 overflow-x-auto no-scrollbar pb-3 mb-3"></div>

    <!-- Links List Container -->
    <div id="linksList" class="space-y-2.5">
      <!-- Skeleton Loading -->
      <div class="p-4 rounded-xl bg-zinc-900/40 border border-zinc-800/60 flex items-center gap-4 animate-pulse">
        <div class="w-10 h-10 rounded-lg bg-zinc-800 shrink-0"></div>
        <div class="flex-1 space-y-2">
          <div class="h-4 bg-zinc-800 rounded w-1/3"></div>
          <div class="h-3 bg-zinc-800/70 rounded w-2/3"></div>
        </div>
      </div>
      <div class="p-4 rounded-xl bg-zinc-900/40 border border-zinc-800/60 flex items-center gap-4 animate-pulse">
        <div class="w-10 h-10 rounded-lg bg-zinc-800 shrink-0"></div>
        <div class="flex-1 space-y-2">
          <div class="h-4 bg-zinc-800 rounded w-1/4"></div>
          <div class="h-3 bg-zinc-800/70 rounded w-1/2"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="max-w-3xl w-full mx-auto px-4 sm:px-6 py-6 text-center text-xs text-zinc-600 font-mono">
    &copy; <span id="year"></span> sainbyte
  </footer>

  <!-- MODAL LOGIN -->
  <div id="loginModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm modal-backdrop opacity-0">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl modal-card scale-95 opacity-0">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold text-white">Admin Access</h2>
        <button onclick="closeModal('loginModal')" class="text-zinc-500 hover:text-zinc-300 transition-colors p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Password</label>
          <input 
            type="password" 
            id="loginPassword" 
            required 
            placeholder="Masukkan password admin..."
            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all"
          />
        </div>
        <button 
          type="submit" 
          id="loginSubmitBtn"
          class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold text-sm py-2.5 rounded-xl transition-all active:scale-[0.98]"
        >
          Masuk
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL ADD / EDIT LINK -->
  <div id="linkModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm modal-backdrop opacity-0">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md p-6 shadow-2xl modal-card scale-95 opacity-0">
      <div class="flex items-center justify-between mb-5">
        <h2 id="linkModalTitle" class="text-base font-semibold text-white">Tambah Link Project</h2>
        <button onclick="closeModal('linkModal')" class="text-zinc-500 hover:text-zinc-300 transition-colors p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="linkForm" class="space-y-4">
        <input type="hidden" id="linkId" />
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Nama Web / Project <span class="text-emerald-400">*</span></label>
          <input 
            type="text" 
            id="linkTitle" 
            required 
            placeholder="Contoh: RunMe"
            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Keterangan <span class="text-zinc-600">(opsional)</span></label>
          <input 
            type="text" 
            id="linkDesc" 
            placeholder="Contoh: Website log run & tracking"
            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">URL Website <span class="text-emerald-400">*</span></label>
          <input 
            type="text" 
            id="linkUrl" 
            required 
            placeholder="run-me-jet.vercel.app atau https://..."
            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all font-mono"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Kategori <span class="text-zinc-600">(opsional)</span></label>
          <select 
            id="linkCategory" 
            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all"
          >
            <option value="">Tanpa Kategori</option>
          </select>
        </div>
        <div class="pt-2 flex items-center justify-end gap-2.5">
          <button 
            type="button" 
            onclick="closeModal('linkModal')" 
            class="px-4 py-2.5 rounded-xl text-sm font-medium text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors"
          >
            Batal
          </button>
          <button 
            type="submit" 
            id="linkSubmitBtn"
            class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-emerald-500 hover:bg-emerald-400 text-zinc-950 transition-all active:scale-[0.98]"
          >
            Simpan
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL KELOLA KATEGORI -->
  <div id="categoryModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm modal-backdrop opacity-0">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md p-6 shadow-2xl modal-card scale-95 opacity-0">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold text-white">Kelola Kategori</h2>
        <button onclick="closeModal('categoryModal')" class="text-zinc-500 hover:text-zinc-300 transition-colors p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Form Tambah Kategori Baru -->
      <form id="addCategoryForm" class="flex gap-2 mb-5">
        <input 
          type="text" 
          id="newCategoryName" 
          required 
          placeholder="Nama kategori baru..."
          class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-500 transition-all"
        />
        <button 
          type="submit" 
          id="addCatBtn"
          class="px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-500 hover:bg-emerald-400 text-zinc-950 transition-all active:scale-95 shrink-0"
        >
          Tambah
        </button>
      </form>

      <!-- Daftar Kategori -->
      <div id="categoryManagerList" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- MODAL KONFIRMASI BUKA LINK -->
  <div id="openLinkModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm modal-backdrop opacity-0">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-sm p-5 shadow-2xl modal-card scale-95 opacity-0">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div>
          <p class="text-[10px] uppercase tracking-[0.18em] text-emerald-400 font-semibold mb-1">Open external link</p>
          <h2 id="openLinkTitle" class="text-base font-semibold text-white">Nama project</h2>
        </div>
        <button onclick="closeModal('openLinkModal')" class="text-zinc-500 hover:text-zinc-300 p-1" aria-label="Tutup">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <p id="openLinkDescription" class="text-sm text-zinc-400 mb-3"></p>
      <div class="rounded-xl bg-zinc-950 border border-zinc-800 px-3 py-2.5 mb-5">
        <p class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">Destination</p>
        <p id="openLinkDomain" class="text-xs text-emerald-300 font-mono break-all"></p>
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('openLinkModal')" class="px-4 py-2.5 rounded-xl text-sm font-medium text-zinc-400 hover:text-white hover:bg-zinc-800">Batal</button>
        <button onclick="confirmOpenLink()" class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-emerald-500 hover:bg-emerald-400 text-zinc-950">Buka Link</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-700 text-sm text-zinc-100 shadow-xl flex items-center gap-2.5">
      <span id="toastIcon"></span>
      <span id="toastMessage"></span>
    </div>
  </div>

  <script src="page.js"></script>
</body>
</html>
