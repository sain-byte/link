<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sainbyte — Project Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090b;
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-row {
      animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .modal-backdrop { transition: opacity 0.22s ease; }
    .modal-card { transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body class="text-zinc-100 antialiased min-h-screen flex flex-col selection:bg-emerald-500/30 selection:text-emerald-200">

  <!-- Navbar / Header -->
  <header class="sticky top-0 z-30 border-b border-zinc-800/80 bg-zinc-950/75 backdrop-blur-md">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
      <a href="#" onclick="resetFilters(event)" class="flex items-center gap-2.5 group shrink-0">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.8)] group-hover:scale-125 transition-transform"></span>
        <span class="font-mono font-bold text-lg tracking-tight text-white">sainbyte</span>
      </a>

      <!-- Auth Actions -->
      <div id="authControls" class="flex items-center gap-1.5 sm:gap-2"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-7 sm:py-9">
    
    <!-- Search & Count -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
      <div class="relative flex-1">
        <svg class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z" />
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Cari project atau keterangan..." 
          class="w-full bg-zinc-900/70 border border-zinc-800/90 rounded-xl pl-10 pr-4 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-emerald-500/60 focus:ring-2 focus:ring-emerald-500/15 transition-all"
        />
      </div>
      <div class="text-xs font-mono text-zinc-500 px-1 shrink-0" id="projectCount">
        Memuat data...
      </div>
    </div>

    <!-- Category Filter Pills -->
    <div id="categoryFilterBar" class="hidden flex items-center gap-2 overflow-x-auto no-scrollbar pb-3 mb-3"></div>

    <!-- Links List Container -->
    <div id="linksList" class="space-y-2.5">
      <!-- Skeleton Loading -->
      <div class="p-4 rounded-xl bg-zinc-900/40 border border-zinc-800/60 flex items-center gap-4 animate-pulse">
        <div class="w-10 h-10 rounded-lg bg-zinc-800 shrink-0"></div>
        <div class="flex-1 space-y-2">
          <div class="h-4 bg-zinc-800 rounded w-1/3"></div>
          <div class="h-3 bg-zinc-800/70 rounded w-2/3"></div>
        </div>
      </div>
      <div class="p-4 rounded-xl bg-zinc-900/40 border border-zinc-800/60 flex items-center gap-4 animate-pulse">
        <div class="w-10 h-10 rounded-lg bg-zinc-800 shrink-0"></div>
        <div class="flex-1 space-y-2">
          <div class="h-4 bg-zinc-800 rounded w-1/4"></div>
          <div class="h-3 bg-zinc-800/70 rounded w-1/2"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="max-w-3xl w-full mx-auto px-4 sm:px-6 py-6 text-center text-xs text-zinc-600 font-mono">
    &copy; <span id="year"></span> sainbyte
  </footer>

  <!-- MODAL LOGIN -->
  <div id="loginModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm modal-backdrop opacity-0">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl modal-card scale-95 opacity-0">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold text-white">Admin Access</h2>
        <button onclick="closeModal('loginModal')" class="text-zinc-500 hover:text-zinc-300 transition-colors p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Password</label>
          <input 
            type="password" 
            id="loginPassword" 
            required 
            placeholder="Masukkan password admin..."
            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all"
          />
        </div>
        <button 
          type="submit" 
          id="loginSubmitBtn"
          class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold text-sm py-2.5 rounded-xl transition-all active:scale-[0.98]"
        >
          Masuk
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL ADD / EDIT LINK -->
  <div id="linkModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm modal-backdrop opacity-0">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md p-6 shadow-2xl modal-card scale-95 opacity-0">
      <div class="flex items-center justify-between mb-5">
        <h2 id="linkModalTitle" class="text-base font-semibold text-white">Tambah Link Project</h2>
        <button onclick="closeModal('linkModal')" class="text-zinc-500 hover:text-zinc-300 transition-colors p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="linkForm" class="space-y-4">
        <input type="hidden" id="linkId" />
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Nama Web / Project <span class="text-emerald-400">*</span></label>
          <input 
            type="text" 
            id="linkTitle" 
            required 
            placeholder="Contoh: RunMe"
            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Keterangan <span class="text-zinc-600">(opsional)</span></label>
          <input 
            type="text" 
            id="linkDesc" 
            placeholder="Contoh: Website log run & tracking"
            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">URL Website <span class="text-emerald-400">*</span></label>
          <input 
            type="text" 
            id="linkUrl" 
            required 
            placeholder="run-me-jet.vercel.app atau https://..."
            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all font-mono"
          />
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Kategori <span class="text-zinc-600">(opsional)</span></label>
          <select 
            id="linkCategory" 
            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all"
          >
            <option value="">Tanpa Kategori</option>
          </select>
        </div>
        <div class="pt-2 flex items-center justify-end gap-2.5">
          <button 
            type="button" 
            onclick="closeModal('linkModal')" 
            class="px-4 py-2.5 rounded-xl text-sm font-medium text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors"
          >
            Batal
          </button>
          <button 
            type="submit" 
            id="linkSubmitBtn"
            class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-emerald-500 hover:bg-emerald-400 text-zinc-950 transition-all active:scale-[0.98]"
          >
            Simpan
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL KELOLA KATEGORI -->
  <div id="categoryModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm modal-backdrop opacity-0">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md p-6 shadow-2xl modal-card scale-95 opacity-0">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold text-white">Kelola Kategori</h2>
        <button onclick="closeModal('categoryModal')" class="text-zinc-500 hover:text-zinc-300 transition-colors p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Form Tambah Kategori Baru -->
      <form id="addCategoryForm" class="flex gap-2 mb-5">
        <input 
          type="text" 
          id="newCategoryName" 
          required 
          placeholder="Nama kategori baru..."
          class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-emerald-500 transition-all"
        />
        <button 
          type="submit" 
          id="addCatBtn"
          class="px-4 py-2 rounded-xl text-sm font-semibold bg-emerald-500 hover:bg-emerald-400 text-zinc-950 transition-all active:scale-95 shrink-0"
        >
          Tambah
        </button>
      </form>

      <!-- Daftar Kategori -->
      <div id="categoryManagerList" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-700 text-sm text-zinc-100 shadow-xl flex items-center gap-2.5">
      <span id="toastIcon"></span>
      <span id="toastMessage"></span>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbz0HZYFjnmmeqbc8glkw3aMrYP5DaXf_Ah5a3N-OAaH1dRdffY7JoUx-sluyqAqzkNFKw/exec';

    let allLinks = [];
    let allCategories = [];
    let selectedCategory = 'ALL';
    let adminPass = localStorage.getItem('sainbyte_admin_pass') || null;

    document.getElementById('year').textContent = new Date().getFullYear();

    document.addEventListener('DOMContentLoaded', () => {
      renderAuthControls();
      fetchData();
    });

    // --- AUTH CONTROLS ---
    function renderAuthControls() {
      const container = document.getElementById('authControls');
      if (adminPass) {
        container.innerHTML = `
          <button 
            onclick="openCategoryModal()" 
            class="px-3 py-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 hover:text-white text-xs sm:text-sm font-medium transition-all active:scale-95"
          >
            Kategori
          </button>
          <button 
            onclick="openAddModal()" 
            class="px-3 sm:px-3.5 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold text-xs sm:text-sm transition-all active:scale-95 flex items-center gap-1 shadow-sm shadow-emerald-500/20"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
            <span>Tambah</span>
          </button>
          <button 
            onclick="logout()" 
            title="Logout"
            class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-zinc-900 hover:bg-rose-950/50 border border-zinc-800 hover:border-rose-900/60 text-zinc-400 hover:text-rose-300 text-xs sm:text-sm font-medium transition-all active:scale-95"
          >
            Logout
          </button>
        `;
      } else {
        container.innerHTML = `
          <button 
            onclick="openModal('loginModal')" 
            class="px-3.5 py-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 hover:text-white text-xs sm:text-sm font-medium transition-all active:scale-95"
          >
            Login
          </button>
        `;
      }
    }

    function logout() {
      adminPass = null;
      localStorage.removeItem('sainbyte_admin_pass');
      renderAuthControls();
      renderCategoryFilter();
      applyFiltersAndRender();
      showToast('Berhasil logout', 'info');
    }

    // --- FETCH DATA ---
    async function fetchData() {
      try {
        const res = await fetch(API_URL);
        const json = await res.json();
        if (json.status === 'success') {
          allLinks = json.data.links || [];
          allCategories = json.data.categories || [];
          renderCategoryFilter();
          applyFiltersAndRender();
        } else {
          showToast(json.message || 'Gagal memuat data', 'error');
        }
      } catch (err) {
        document.getElementById('linksList').innerHTML = `
          <div class="text-center py-12 px-4 rounded-2xl border border-dashed border-zinc-800 text-zinc-500 text-sm">
            Gagal terhubung ke server. Pastikan fungsi setup() di GAS sudah dijalankan & di-deploy ulang.
          </div>
        `;
      }
    }

    // --- URL & MULTI-SOURCE FAVICON HELPERS ---
    function normalizeUrl(rawUrl) {
      let u = (rawUrl || '').trim();
      if (!u) return '';
      if (!/^https?:\/\//i.test(u)) {
        u = 'https://' + u;
      }
      return u;
    }

    function getFaviconSources(url) {
      try {
        const parsed = new URL(normalizeUrl(url));
        const origin = parsed.origin;
        const domain = parsed.hostname;
        return {
          directPng: `${origin}/favicon.png`,
          directIco: `${origin}/favicon.ico`,
          directSvg: `${origin}/favicon.svg`,
          ddg: `https://icons.duckduckgo.com/ip3/${domain}.ico`,
          google: `https://www.google.com/s2/favicons?domain=${domain}&sz=64`
        };
      } catch {
        return { directPng: '', directIco: '', directSvg: '', ddg: '', google: '' };
      }
    }

    function handleFaviconError(imgEl, icoUrl, svgUrl, ddgUrl) {
      const step = imgEl.dataset.step || '0';
      if (step === '0' && icoUrl) {
        imgEl.dataset.step = '1';
        imgEl.src = icoUrl;
      } else if (step === '1' && svgUrl) {
        imgEl.dataset.step = '2';
        imgEl.src = svgUrl;
      } else if (step === '2' && ddgUrl) {
        imgEl.dataset.step = '3';
        imgEl.src = ddgUrl;
      } else {
        imgEl.style.display = 'none';
        if (imgEl.nextElementSibling) {
          imgEl.nextElementSibling.style.display = 'block';
        }
      }
    }

    function getCleanDomain(url) {
      try {
        return new URL(normalizeUrl(url)).hostname.replace(/^www\./, '');
      } catch {
        return url;
      }
    }

    // --- CATEGORY FILTER BAR ---
    function renderCategoryFilter() {
      const bar = document.getElementById('categoryFilterBar');
      const visibleLinks = adminPass ? allLinks : allLinks.filter(l => !l.hidden);
      const usedCats = new Set(visibleLinks.map(l => l.category).filter(Boolean));
      const catNames = allCategories.map(c => c.name).filter(name => adminPass || usedCats.has(name));

      if (catNames.length === 0) {
        bar.classList.add('hidden');
        selectedCategory = 'ALL';
        return;
      }

      bar.classList.remove('hidden');
      const pills = ['ALL', ...catNames];

      bar.innerHTML = pills.map(cat => {
        const isActive = selectedCategory === cat;
        const label = cat === 'ALL' ? 'Semua' : escapeHtml(cat);
        return `
          <button
            onclick="selectCategory('${escapeHtml(cat)}')"
            class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all ${
              isActive 
                ? 'bg-emerald-500 text-zinc-950 font-semibold shadow-sm shadow-emerald-500/20' 
                : 'bg-zinc-900/80 text-zinc-400 hover:text-zinc-200 border border-zinc-800/80'
            }"
          >
            ${label}
          </button>
        `;
      }).join('');
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategoryFilter();
      applyFiltersAndRender();
    }

    function resetFilters(e) {
      if (e) e.preventDefault();
      selectedCategory = 'ALL';
      document.getElementById('searchInput').value = '';
      renderCategoryFilter();
      applyFiltersAndRender();
    }

    // --- FILTER & RENDER LIST ---
    function applyFiltersAndRender() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = allLinks.filter(item => {
        if (!adminPass && item.hidden) return false;
        if (selectedCategory !== 'ALL' && item.category !== selectedCategory) return false;

        if (q) {
          const matchTitle = item.title.toLowerCase().includes(q);
          const matchDesc = (item.description || '').toLowerCase().includes(q);
          const matchUrl = item.url.toLowerCase().includes(q);
          const matchCat = (item.category || '').toLowerCase().includes(q);
          return matchTitle || matchDesc || matchUrl || matchCat;
        }
        return true;
      });

      renderLinks(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applyFiltersAndRender);

    function renderLinks(links) {
      const container = document.getElementById('linksList');
      const countEl = document.getElementById('projectCount');
      countEl.textContent = `${links.length} project`;

      if (links.length === 0) {
        container.innerHTML = `
          <div class="text-center py-14 px-4 rounded-2xl bg-zinc-900/30 border border-dashed border-zinc-800/80">
            <p class="text-zinc-400 text-sm font-medium">Tidak ada project yang ditampilkan.</p>
            <p class="text-zinc-600 text-xs mt-1">${adminPass ? 'Klik "+ Tambah" di kanan atas untuk menambah link baru.' : 'Login sebagai admin untuk mengelola daftar link.'}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = links.map((item, idx) => {
        const fullUrl = normalizeUrl(item.url);
        const icons = getFaviconSources(fullUrl);
        const domain = getCleanDomain(fullUrl);
        const delay = Math.min(idx * 40, 400);
        const isHidden = item.hidden;

        const adminButtons = adminPass ? `
          <div class="flex items-center gap-0.5 sm:gap-1 pl-2 border-l border-zinc-800/80 shrink-0" onclick="event.stopPropagation()">
            <button 
              onclick="toggleHideLink('${item.id}')" 
              title="${isHidden ? 'Tampilkan (Unhide)' : 'Sembunyikan (Hide)'}"
              class="p-1.5 sm:p-2 rounded-lg transition-colors ${isHidden ? 'text-amber-400 bg-amber-500/10 hover:bg-amber-500/20' : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/80'}"
            >
              ${isHidden ? `
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
              ` : `
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              `}
            </button>
            <button 
              onclick="openEditModal('${item.id}')" 
              title="Edit"
              class="p-1.5 sm:p-2 rounded-lg text-zinc-400 hover:text-sky-400 hover:bg-zinc-800/80 transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            </button>
            <button 
              onclick="deleteLink('${item.id}', '${escapeHtml(item.title)}')" 
              title="Hapus"
              class="p-1.5 sm:p-2 rounded-lg text-zinc-400 hover:text-rose-400 hover:bg-zinc-800/80 transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        ` : '';

        return `
          <div 
            onclick="window.open('${escapeHtml(fullUrl)}', '_blank', 'noopener,noreferrer')"
            style="animation-delay: ${delay}ms"
            class="animate-row group relative flex items-center gap-3.5 sm:gap-4 p-3.5 sm:p-4 rounded-xl border cursor-pointer transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-black/40 ${
              isHidden 
                ? 'bg-zinc-950/50 border-dashed border-zinc-800/70 opacity-60 hover:opacity-95' 
                : 'bg-zinc-900/60 hover:bg-zinc-900 border-zinc-800/80 hover:border-zinc-700'
            }"
          >
            <!-- Favicon -->
            <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-zinc-950 border border-zinc-800/90 flex items-center justify-center shrink-0 overflow-hidden group-hover:border-emerald-500/40 transition-colors">
              <img 
                src="${icons.directPng}" 
                alt="${escapeHtml(item.title)}" 
                class="w-5 h-5 sm:w-6 sm:h-6 object-contain"
                onerror="handleFaviconError(this, '${icons.directIco}', '${icons.directSvg}', '${icons.ddg}')"
              />
              <svg class="w-5 h-5 text-zinc-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
              </svg>
            </div>

            <!-- Title, Badges & Description -->
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <h3 class="font-semibold text-sm sm:text-base text-zinc-100 group-hover:text-emerald-400 transition-colors truncate">
                  ${escapeHtml(item.title)}
                </h3>
                ${item.category ? `
                  <span class="text-[10px] font-medium text-emerald-300/90 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-full">
                    ${escapeHtml(item.category)}
                  </span>
                ` : ''}
                ${isHidden ? `
                  <span class="text-[10px] font-mono text-amber-400 bg-amber-500/10 border border-amber-500/20 px-1.5 py-0.5 rounded">
                    Hidden
                  </span>
                ` : ''}
                <span class="hidden md:inline-block text-[11px] font-mono text-zinc-500 bg-zinc-950/80 px-2 py-0.5 rounded-md border border-zinc-800/70 truncate max-w-[180px]">
                  ${escapeHtml(domain)}
                </span>
              </div>
              ${item.description ? `
                <p class="text-xs sm:text-sm text-zinc-400 truncate mt-0.5">
                  ${escapeHtml(item.description)}
                </p>
              ` : `
                <p class="text-xs text-zinc-500 font-mono truncate mt-0.5 md:hidden">
                  ${escapeHtml(domain)}
                </p>
              `}
            </div>

            <!-- External Arrow -->
            <div class="text-zinc-600 group-hover:text-emerald-400 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all shrink-0">
              <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 17L17 7M17 7H7M17 7v10"/>
              </svg>
            </div>

            <!-- Admin Controls -->
            ${adminButtons}
          </div>
        `;
      }).join('');
    }

    // --- LOGIN ---
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const passInput = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');
      const orig = btn.textContent;

      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'login', password: passInput })
        });
        const json = await res.json();

        if (json.status === 'success') {
          adminPass = passInput;
          localStorage.setItem('sainbyte_admin_pass', adminPass);
          closeModal('loginModal');
          document.getElementById('loginForm').reset();
          renderAuthControls();
          renderCategoryFilter();
          applyFiltersAndRender();
          showToast('Mode admin aktif!', 'success');
        } else {
          showToast(json.message || 'Password salah', 'error');
        }
      } catch {
        showToast('Terjadi kesalahan jaringan', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    });

    // --- ADD / EDIT LINK MODAL ---
    function populateCategorySelect(selectedVal = '') {
      const select = document.getElementById('linkCategory');
      select.innerHTML = `<option value="">Tanpa Kategori</option>` + 
        allCategories.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');
      select.value = selectedVal;
    }

    function openAddModal() {
      document.getElementById('linkModalTitle').textContent = 'Tambah Link Project';
      document.getElementById('linkForm').reset();
      document.getElementById('linkId').value = '';
      populateCategorySelect('');
      openModal('linkModal');
      setTimeout(() => document.getElementById('linkTitle').focus(), 100);
    }

    function openEditModal(id) {
      const item = allLinks.find(l => l.id === id);
      if (!item) return;

      document.getElementById('linkModalTitle').textContent = 'Edit Link Project';
      document.getElementById('linkId').value = item.id;
      document.getElementById('linkTitle').value = item.title;
      document.getElementById('linkDesc').value = item.description || '';
      document.getElementById('linkUrl').value = item.url;
      populateCategorySelect(item.category || '');
      openModal('linkModal');
    }

    document.getElementById('linkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('linkId').value;
      const title = document.getElementById('linkTitle').value.trim();
      const description = document.getElementById('linkDesc').value.trim();
      const url = normalizeUrl(document.getElementById('linkUrl').value);
      const category = document.getElementById('linkCategory').value;

      const btn = document.getElementById('linkSubmitBtn');
      const orig = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      const action = id ? 'edit_link' : 'add_link';
      const payload = { action, password: adminPass, id, title, description, url, category };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();

        if (json.status === 'success') {
          closeModal('linkModal');
          showToast(id ? 'Link diperbarui' : 'Link ditambahkan', 'success');
          await fetchData();
        } else {
          showToast(json.message || 'Gagal menyimpan', 'error');
        }
      } catch {
        showToast('Gagal terhubung ke server', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = orig;
      }
    });

    // --- TOGGLE HIDE ---
    async function toggleHideLink(id) {
      const target = allLinks.find(l => l.id === id);
      if (target) {
        target.hidden = !target.hidden;
        applyFiltersAndRender();
      }

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'toggle_hide', password: adminPass, id })
        });
        const json = await res.json();
        if (json.status === 'success') {
          showToast(json.hidden ? 'Link disembunyikan' : 'Link ditampilkan kembali', 'info');
        } else {
          showToast(json.message || 'Gagal mengubah status', 'error');
          await fetchData();
        }
      } catch {
        showToast('Gagal terhubung ke server', 'error');
        await fetchData();
      }
    }

    // --- DELETE LINK ---
    async function deleteLink(id, title) {
      if (!confirm(`Hapus project "${title}"?`)) return;

      showToast('Menghapus...', 'info');
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete_link', password: adminPass, id })
        });
        const json = await res.json();
        if (json.status === 'success') {
          showToast('Link dihapus', 'success');
          await fetchData();
        } else {
          showToast(json.message || 'Gagal menghapus', 'error');
        }
      } catch {
        showToast('Gagal terhubung ke server', 'error');
      }
    }

    // --- CATEGORY MANAGER ---
    function openCategoryModal() {
      renderCategoryManagerList();
      openModal('categoryModal');
    }

    function renderCategoryManagerList() {
      const container = document.getElementById('categoryManagerList');
      if (allCategories.length === 0) {
        container.innerHTML = `<p class="text-xs text-zinc-500 text-center py-4">Belum ada kategori. Tambahkan di atas.</p>`;
        return;
      }

      container.innerHTML = allCategories.map(cat => `
        <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-zinc-950 border border-zinc-800/80">
          <span class="text-sm text-zinc-200 truncate pl-1">${escapeHtml(cat.name)}</span>
          <div class="flex items-center gap-1 shrink-0">
            <button 
              onclick="renameCategory('${cat.id}', '${escapeHtml(cat.name)}')" 
              title="Rename"
              class="p-1.5 rounded-lg text-zinc-400 hover:text-sky-400 hover:bg-zinc-900 transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            </button>
            <button 
              onclick="deleteCategory('${cat.id}', '${escapeHtml(cat.name)}')" 
              title="Hapus"
              class="p-1.5 rounded-lg text-zinc-400 hover:text-rose-400 hover:bg-zinc-900 transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('newCategoryName');
      const name = input.value.trim();
      if (!name) return;

      const btn = document.getElementById('addCatBtn');
      btn.disabled = true;
      btn.textContent = '...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'add_category', password: adminPass, name })
        });
        const json = await res.json();
        if (json.status === 'success') {
          input.value = '';
          showToast('Kategori ditambahkan', 'success');
          await fetchData();
          renderCategoryManagerList();
        } else {
          showToast(json.message || 'Gagal menambah kategori', 'error');
        }
      } catch {
        showToast('Gagal terhubung ke server', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Tambah';
      }
    });

    async function renameCategory(id, oldName) {
      const newName = prompt('Ubah nama kategori:', oldName);
      if (!newName || newName.trim() === '' || newName.trim() === oldName) return;

      showToast('Mengubah nama...', 'info');
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'rename_category', password: adminPass, id, name: newName.trim() })
        });
        const json = await res.json();
        if (json.status === 'success') {
          if (selectedCategory === oldName) selectedCategory = newName.trim();
          showToast('Kategori diubah', 'success');
          await fetchData();
          renderCategoryManagerList();
        } else {
          showToast(json.message || 'Gagal mengubah kategori', 'error');
        }
      } catch {
        showToast('Gagal terhubung ke server', 'error');
      }
    }

    async function deleteCategory(id, name) {
      if (!confirm(`Hapus kategori "${name}"? (Project di dalamnya tidak terhapus, hanya jadi Tanpa Kategori)`)) return;

      showToast('Menghapus kategori...', 'info');
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete_category', password: adminPass, id })
        });
        const json = await res.json();
        if (json.status === 'success') {
          if (selectedCategory === name) selectedCategory = 'ALL';
          showToast('Kategori dihapus', 'success');
          await fetchData();
          renderCategoryManagerList();
        } else {
          showToast(json.message || 'Gagal menghapus', 'error');
        }
      } catch {
        showToast('Gagal terhubung ke server', 'error');
      }
    }

    // --- MODAL ANIMATION HELPERS ---
    function openModal(id) {
      const modal = document.getElementById(id);
      const card = modal.querySelector('.modal-card');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      requestAnimationFrame(() => {
        modal.classList.remove('opacity-0');
        card.classList.remove('scale-95', 'opacity-0');
        card.classList.add('scale-100', 'opacity-100');
      });
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      const card = modal.querySelector('.modal-card');
      modal.classList.add('opacity-0');
      card.classList.remove('scale-100', 'opacity-100');
      card.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }, 220);
    }

    ['loginModal', 'linkModal', 'categoryModal'].forEach(id => {
      document.getElementById(id).addEventListener('click', (e) => {
        if (e.target.id === id) closeModal(id);
      });
    });

    // --- TOAST ---
    let toastTimer;
    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      const message = document.getElementById('toastMessage');

      const colors = {
        success: 'bg-emerald-400',
        error: 'bg-rose-400',
        info: 'bg-sky-400'
      };
      icon.innerHTML = `<span class="w-2 h-2 rounded-full ${colors[type] || colors.info}"></span>`;
      message.textContent = msg;

      toast.classList.remove('translate-y-20', 'opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
